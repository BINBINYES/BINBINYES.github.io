<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V152 远端监控台</title>
<style>
:root{color-scheme:dark;--bg:#030812;--panel:#071427;--panel2:#0b1931;--line:#0d86a6;--line2:#153752;--text:#f4f9ff;--muted:#86aeca;--cyan:#00e5ff;--green:#00f5a0;--pink:#ff2f84;--yellow:#ffd35c}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;color:var(--text);font:14px/1.45 "Microsoft YaHei","PingFang SC",Inter,system-ui,sans-serif;background:linear-gradient(rgba(0,229,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.045) 1px,transparent 1px),radial-gradient(circle at 12% 0%,rgba(255,47,132,.16),transparent 28%),radial-gradient(circle at 88% 5%,rgba(0,245,160,.12),transparent 28%),var(--bg);background-size:32px 32px,32px 32px,auto,auto,auto}.wrap{width:min(1480px,calc(100vw - 28px));margin:0 auto;padding:18px 0 34px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}h1{font-size:28px;line-height:1.05;margin:0 0 6px;color:#fff;text-shadow:0 0 18px rgba(0,229,255,.35)}h2{font-size:16px;margin:0}.sub,.muted{color:var(--muted)}.sub{font-size:13px}.statusbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.badge,.btn{border:1px solid rgba(0,229,255,.45);background:rgba(7,20,39,.78);color:var(--text);border-radius:8px;padding:7px 10px;box-shadow:0 0 18px rgba(0,229,255,.08);white-space:nowrap}.btn{cursor:pointer}.btn.on{border-color:var(--green);color:var(--green)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#5a6475;margin-right:6px;box-shadow:0 0 10px #5a6475}.dot.ok{background:var(--green);box-shadow:0 0 14px var(--green)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}.two{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:12px;margin-bottom:12px}.tables{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}.panel{min-width:0;overflow:hidden;background:linear-gradient(180deg,rgba(11,25,49,.9),rgba(5,13,27,.94));border:1px solid rgba(0,229,255,.32);border-radius:8px;padding:14px;box-shadow:0 0 0 1px rgba(255,255,255,.02) inset,0 18px 60px rgba(0,0,0,.28)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.kpi .label{color:var(--muted);font-size:12px}.kpi .value{font-size:24px;font-weight:800;margin-top:6px}.up{color:var(--pink)}.down{color:var(--green)}.flat{color:var(--muted)}.envgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}.cell{border:1px solid var(--line2);background:rgba(3,8,18,.45);border-radius:8px;padding:10px}.cell span{display:block;color:var(--muted);font-size:12px}.cell b{display:block;font-size:19px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note{border:1px solid rgba(255,211,92,.45);background:rgba(255,154,61,.09);border-radius:8px;padding:9px 10px;color:#ffdca0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pos{border:1px solid rgba(0,229,255,.26);border-radius:8px;background:rgba(3,8,18,.58);padding:12px}.pos-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}.pos b{font-size:16px}.pos small{display:block;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.mini{border:1px solid var(--line2);border-radius:7px;padding:7px;background:rgba(8,21,41,.7)}.mini span{display:block;color:var(--muted);font-size:11px}.mini strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-flex;align-items:center;max-width:100%;gap:4px;border:1px solid #31506d;border-radius:999px;padding:3px 8px;font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(9,24,44,.88)}.pill.green{border-color:rgba(0,245,160,.62);color:var(--green);background:rgba(0,245,160,.09)}.pill.red{border-color:rgba(255,47,132,.62);color:#ff7dad;background:rgba(255,47,132,.09)}.pill.yellow{border-color:rgba(255,211,92,.68);color:var(--yellow);background:rgba(255,211,92,.1)}.pill.cyan{border-color:rgba(0,229,255,.62);color:var(--cyan);background:rgba(0,229,255,.08)}.scroll{overflow-x:auto;max-width:100%;border:1px solid var(--line2);border-radius:8px}table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:720px}th{color:#9cc6e8;text-align:left;font-size:12px;background:rgba(9,35,59,.88)}th,td{padding:9px 10px;border-bottom:1px solid rgba(92,137,173,.22);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}td.wrap{white-space:normal;word-break:break-word;line-height:1.35}.name{font-weight:800}.empty{color:#9bb8d0;border:1px dashed #29435e;border-radius:8px;padding:14px;background:rgba(3,8,18,.35)}.mainline-list{display:grid;gap:8px}.mainline-row{display:grid;grid-template-columns:190px minmax(0,1fr) 54px;gap:12px;align-items:center;border-bottom:1px solid rgba(92,137,173,.18);padding:7px 0}.mainline-row:last-child{border-bottom:0}.mainline-row b,.mainline-row .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:9px;border:1px solid rgba(0,229,255,.35);border-radius:999px;background:#09213b;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--yellow),var(--pink));border-radius:999px}.history{display:grid;gap:8px}.hist{border-left:3px solid var(--cyan);background:rgba(3,8,18,.45);padding:9px 10px;border-radius:7px}.hist strong,.hist span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hist span{color:var(--muted);font-size:12px}@media(max-width:1280px){.two,.tables{grid-template-columns:1fr}}@media(max-width:980px){.grid,.envgrid,.cards{grid-template-columns:1fr 1fr}.top{display:block}.statusbar{justify-content:flex-start;margin-top:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.mainline-row{grid-template-columns:1fr 1fr 42px}}@media(max-width:640px){.wrap{width:calc(100vw - 16px)}.grid,.envgrid,.cards{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div><h1 id="title">V152 远端监控台</h1><div class="sub">桌面模型自动同步，只做研究提醒与纸面模拟，不连接券商下单</div></div><div class="statusbar"><div class="badge"><span id="dot" class="dot"></span><span id="remoteState">状态读取中</span></div><div id="updated" class="badge">已更新 --</div><button id="alarmBtn" class="btn">仓位铃声 OFF</button></div></header>
<section class="grid"><div class="panel kpi"><div class="label">总权益</div><div id="equity" class="value">--</div><div id="equityPct" class="muted">--</div></div><div class="panel kpi"><div class="label">浮动盈亏</div><div id="floating" class="value">--</div><div id="floatingPct" class="muted">--</div></div><div class="panel kpi"><div class="label">持仓市值</div><div id="marketValue" class="value">--</div><div id="posCount" class="muted">--</div></div><div class="panel kpi"><div class="label">已实现盈亏</div><div id="realized" class="value">--</div><div class="muted">重置后口径</div></div></section>
<section class="panel"><div class="panel-head"><h2>全市场环境 / 情绪 / 门控</h2><span id="gateBadge" class="pill cyan">读取中</span></div><div class="envgrid"><div class="cell"><span>市场温度</span><b id="envMarket">--</b></div><div class="cell"><span>资金结构</span><b id="envCapital">--</b></div><div class="cell"><span>恐贪分</span><b id="envFear">--</b></div><div class="cell"><span>攻击状态</span><b id="attackState">--</b></div></div><div id="gateNote" class="note">等待桌面端同步门控状态。</div></section>
<section class="two"><div class="panel"><div class="panel-head"><h2>当前持仓</h2></div><div id="positions" class="cards"></div></div><div class="panel"><div class="panel-head"><h2>主线强度</h2></div><div id="mainlineMeta" class="muted" style="margin:-4px 0 10px">读取中</div><div id="mainlines" class="mainline-list"></div></div></section>
<section class="tables"><div class="panel"><div class="panel-head"><h2>分时异动识别</h2><span id="intradayCount" class="pill green">--</span></div><div class="scroll"><table><thead><tr><th style="width:88px">代码</th><th style="width:110px">名称</th><th style="width:120px">状态</th><th>主线/等级</th><th style="width:140px">资金承接</th><th style="width:82px">涨幅</th><th style="width:86px">现价</th></tr></thead><tbody id="intraday"></tbody></table></div></div><div class="panel"><div class="panel-head"><h2>主线晋级候选映射</h2><span id="promoCount" class="pill green">--</span></div><div class="scroll"><table><thead><tr><th style="width:88px">代码</th><th style="width:110px">名称</th><th>主线</th><th style="width:122px">动作</th><th style="width:78px">晋级分</th><th style="width:132px">资金承接</th><th style="width:90px">涨幅</th></tr></thead><tbody id="promo"></tbody></table></div></div></section>
<section class="tables"><div class="panel"><div class="panel-head"><h2>两天内操作历史</h2></div><div id="history" class="history"></div></div><div class="panel"><div class="panel-head"><h2>已卖出盈亏历史订单</h2></div><div id="closed" class="history"></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);const raw=v=>v===undefined||v===null||v===""?"--":String(v);const esc=v=>raw(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const num=v=>{const x=parseFloat(raw(v).replace(/[,％%万]/g,""));return Number.isFinite(x)?x:0};const tone=v=>num(v)>0?"up":num(v)<0?"down":"flat";
const TEXT={V152_STABLE_ATTACK:"稳定攻击模型",MAINLINE_PROMOTION_MONITOR:"主线晋级监控",BUYABLE6:"可买六条件",NO_SZ_MAIN_10CM:"排除深市主板10cm",NO_AEROSPACE:"排除航空航天弱主线",NO_LONG3:"排除龙三",ACCOUNT_DD_LOCKS:"账户回撤锁",SH_MAIN_10CM:"沪市主板10cm",SZ_MAIN_10CM:"深市主板10cm",CHINEXT_20CM:"创业板20cm",STAR_20CM:"科创板20cm",dynamic_live_monitor_pool:"动态实时监控池",local_csv:"本地缓存",tencent:"腾讯行情",eastmoney:"东方财富行情",sina:"新浪行情",MODEL_AUTO_BUY:"模型模拟买入",MODEL_AUTO_SELL:"模型模拟卖出",MODEL_AUTO_STOP:"模型模拟止损卖出",MODEL_AUTO_REDUCE:"模型模拟减仓",MODEL_EXPECTATION_REDUCE:"低预期模拟减仓",MODEL_BUY_NOT_FILLED:"买入信号未成交",USER_MANUAL_BUY:"用户手动买入",USER_MANUAL_SELL:"用户手动卖出",USER_MANUAL_SELL_SYNC:"用户手动卖出同步",USER_MANUAL_CONFIRMED:"用户已手动确认",REAL_ACCOUNT_MANUAL_BUY_MONITORED:"手动买入后模型监控退出",MODEL_AUTO_LOCAL_STRUCTURE:"模型本地结构信号",T1_BLOCKED_STOP:"T+1锁定，暂不模拟卖出",T1_BLOCKED_EXPECTATION_REDUCE:"T+1锁定，暂不模拟减仓",STOP_DEFERRED_OUT_OF_SESSION:"非连续交易时段，暂不模拟卖出",EXPECTATION_REDUCE_DEFERRED:"非连续交易时段，低预期减仓暂缓",PROMOTION_CANDIDATE_MONITOR:"主线晋级",PROMOTION_WATCH:"晋级观察",MODEL_TRIAL_BUY_WATCH:"试买观察",NO_PROMOTION:"暂不晋级",WAIT_CONFIRM:"等待确认",WAIT:"等待",OBSERVE:"观察",ATTACK_CONFIRMED:"分时进攻确认",ACCEPTANCE_IMPROVING:"承接增强",WATCH_BUY_POINT:"买点观察",INTRADAY_RISK:"分时风险",ok:"正常",observe:"观察",below_cost:"低于成本",defense:"跌破防守线",strict:"跌破严格线",flow_exit:"资金转弱/退出监控",manual_confirm_required:"需要手动确认",HOT:"市场偏热",WARM:"市场偏暖",NEUTRAL:"市场中性",COLD:"市场偏冷",RISK_OFF:"风险退潮",DATA_STALE:"数据失真",BROAD_INFLOW:"资金扩散进攻",STRUCTURAL_INFLOW:"结构性流入",OUTFLOW:"资金退潮",CROWDING:"资金抱团",LOCAL_ROTATION_TRAP:"局部轮动陷阱",background_only_position_sizing:"仅用于仓位权重",waiting_for_closing_window:"等待尾盘确认窗口",after_close:"收盘后",afternoon_session:"下午交易时段",waiting_for_v1519r_30m_window:"等待误拒绝修正窗口",v1519r_trial_disabled:"误拒绝修正试买未开启",regime_risk_off:"市场处于风险退潮",not_closing_10m_gate_window:"未到尾盘确认窗口",mainline_promotion_trial_disabled:"主线晋级试买未开启",promotion_auto_buy_disabled:"晋级自动买入未开启",auto_buy_disabled:"自动模拟买入未开启",connected:"已连接",disconnected:"未连接",running:"运行中"};
function zh(v,fallback="--"){let s=raw(v).trim();if(!s||s==="--")return fallback;if(TEXT[s])return TEXT[s];for(const k of Object.keys(TEXT).sort((a,b)=>b.length-a.length)){if(s.includes(k))s=s.split(k).join(TEXT[k])}s=s.replace(/\.v\d+/g,"");if(/[�锟閼闂閹鐠娴妗鍊濡瀵绾搁杩滅]/.test(s)||/\?{2,}/.test(s))return fallback;if(/^[a-z0-9_.-]+(?:_[a-z0-9_.-]+)+$/i.test(s))return "系统信号";return s}
function blockerOne(v){const s=raw(v).trim();if(!s||s==="无")return "";if(TEXT[s])return TEXT[s];if(s.startsWith("candidate_mood<"))return "候选池热度低于"+s.split("<")[1];if(s.startsWith("fear_greed<"))return "恐贪分低于"+s.split("<")[1];if(s.startsWith("market_env_age>"))return "全市场环境扫描超时";if(s.startsWith("regime_"))return "市场温度未放行";if(s.startsWith("capital_structure_"))return "资金结构未放行";return zh(s,"门控提示")}
function blockerText(v){return raw(v).split(/[;；,]/).map(x=>blockerOne(x)).filter(Boolean).join("；")}
function evidence(v){let s=zh(v,"");if(!s)return "";const reps=[["model=","模型="],["board=","板块="],["mainline=","主线="],["node=","产业节点="],["mainline_strong=","主线强候选数="],["hiddenflow=--","资金承接=缺失"],["hiddenflow=","资金承接="],["rt_pct=","涨幅="],["depth_source=","数据来源="]];for(const [a,b] of reps)s=s.split(a).join(b);return s.replace(/\s*\/\s*/g,"；").replace(/\s*;\s*/g,"；")}
const pill=(s,c="cyan")=>`<span class="pill ${c}">${esc(zh(s))}</span>`;const posSig=rows=>(rows||[]).map(p=>[p.code,p.qty,p.cost,p.price,p.state,p.source].join(":")).join("|");let alarm=localStorage.getItem("v152.remote.alarm")==="1";function alarmUi(){$("alarmBtn").classList.toggle("on",alarm);$("alarmBtn").textContent=alarm?"仓位铃声 ON":"仓位铃声 OFF"}function ring(){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();[0,.18,.36,.54].forEach((t,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type="square";o.frequency.value=i%2?1280:920;g.gain.setValueAtTime(.0001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.28,ctx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.16);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.18)})}catch(e){}}$("alarmBtn").onclick=()=>{alarm=!alarm;localStorage.setItem("v152.remote.alarm",alarm?"1":"0");alarmUi();if(alarm)ring()};alarmUi();
function flow(r){const s=zh(r?.v1519_flow||[r?.hiddenflow_label,r?.hiddenflow_score].filter(Boolean).join(" ")||"--");const good=/承接|确认|增强|净流/.test(s),bad=/出货|风险|转弱|撤退/.test(s);return pill(s,good?"green":bad?"yellow":"cyan")}function exp(r){const s=zh([r?.expectation_label,r?.expectation_position_text].filter(Boolean).join(" "),"");return pill(s||"--",/高/.test(s)?"green":/低/.test(s)?"yellow":"cyan")}
function renderKpi(d){$("equity").textContent=zh(d.equity);$("equityPct").textContent=`${zh(d.equity_detail||d.total_pnl_pct)} · 可用 ${zh(d.cash)}`;$("floating").textContent=zh(d.floating_pnl);$("floating").className="value "+tone(d.floating_pnl);$("floatingPct").textContent=zh(d.floating_pnl_pct);$("marketValue").textContent=zh(d.market_value);$("posCount").textContent=`${zh(d.positions_count||0)} 只持仓`;$("realized").textContent=zh(d.realized_pnl);$("realized").className="value "+tone(d.realized_pnl)}
function renderEnv(d){const e=d.market_environment||{},g=d.auto_buy_gate||{},fg=e.fear_greed||{},cap=e.capital_structure||{};$("envMarket").textContent=zh(g.regime||e.regime);$("envCapital").textContent=zh(g.capital_label||cap.label||cap.state);$("envFear").textContent=zh(g.fear_greed??fg.score);$("attackState").textContent=g.can_auto_buy?"允许进攻":"等待/阻断";$("gateBadge").textContent=g.can_auto_buy?"允许进攻":"V152门控";$("gateBadge").className="pill "+(g.can_auto_buy?"green":"yellow");const bs=[...(g.hard_blockers||[]),...(g.blockers||[]),...(g.promotion_blockers||[])].slice(0,7);$("gateNote").innerHTML=bs.length?`阻断/提示：${bs.map(x=>pill(blockerText(x)||zh(x),"yellow")).join(" ")}`:"当前没有主要阻断项。"}
function renderPositions(rows){$("positions").innerHTML=rows&&rows.length?rows.map(p=>`<div class="pos"><div class="pos-head"><div><b>${esc(p.code)} ${esc(zh(p.name))}</b><small>${esc(zh(p.source||p.quote_source||""))}</small></div>${pill(zh(p.level||p.state),p.level==="ok"?"green":"yellow")}</div><div class="stats"><div class="mini"><span>数量</span><strong>${esc(p.qty)}</strong></div><div class="mini"><span>成本</span><strong>${esc(p.cost)}</strong></div><div class="mini"><span>现价</span><strong>${esc(p.price)}</strong></div><div class="mini"><span>浮动</span><strong class="${tone(p.pnl_pct)}">${esc(p.pnl_amount)} / ${esc(p.pnl_pct)}%</strong></div><div class="mini"><span>防守价</span><strong>${esc(p.defense_price)}</strong></div><div class="mini"><span>严格线</span><strong>${esc(p.strict_price)}</strong></div><div class="mini"><span>资金承接</span><strong>${flow(p)}</strong></div><div class="mini"><span>预期</span><strong>${exp(p)}</strong></div></div></div>`).join(""):`<div class="empty">暂无持仓。</div>`}
function renderMainlines(m){const meta=Array.isArray(m)?{}:(m||{}),rows=Array.isArray(m)?m:(meta.rows||[]),list=rows.slice(0,8),max=Math.max(1,...list.map(r=>num(r.strong_candidates)));$("mainlineMeta").textContent=`${zh(meta.mode||"动态/静态聚合")} · 更新 ${zh(meta.as_of)}`;$("mainlines").innerHTML=list.length?list.map(r=>{const strong=num(r.strong_candidates),w=Math.max(3,Math.round(strong/max*100));return `<div class="mainline-row"><div><b>${esc(zh(r.mainline))}</b><div class="muted">${esc(zh([r.node,r.top_companies].filter(Boolean).join(" · "),""))}</div></div><div class="bar"><i style="width:${w}%"></i></div><div class="up"><b>${strong} 强</b></div></div>`}).join(""):`<div class="empty">暂无主线强度。</div>`}
function renderIntraday(rows){const good=(rows||[]).filter(r=>/承接|确认|增强|净流/.test(zh(r.v1519_flow||r.label||r.state||""))).slice(0,18);$("intradayCount").textContent=`${good.length} 条`;$("intraday").innerHTML=good.length?good.map(r=>`<tr><td><b>${esc(r.code)}</b></td><td class="name">${esc(zh(r.name))}</td><td>${pill(zh(r.label||r.state),"green")}</td><td title="${esc(zh(r.pool||""))}">${esc(zh(r.pool||[r.mainline,r.node,r.candidate_tier].filter(Boolean).join(" / ")))}</td><td>${flow(r)}</td><td class="${tone(r.rt_pct||r.pct)}">${esc(r.rt_pct||r.pct)}</td><td>${esc(r.price)}</td></tr>`).join(""):`<tr><td colspan="7" class="muted">暂无分时进攻确认或承接增强。</td></tr>`}
function renderPromo(p){const rows=((p||{}).rows||[]).filter(r=>zh(r.action_zh||r.label||r.action||"").includes("晋级")||num(r.promotion_score)>=70).slice(0,18);$("promoCount").textContent=`${rows.length} 条`;$("promo").innerHTML=rows.length?rows.map(r=>`<tr><td><b>${esc(r.code)}</b></td><td class="name">${esc(zh(r.name))}</td><td>${esc(zh(r.theme||[r.mainline,r.node].filter(Boolean).join(" / ")))}</td><td>${pill(zh(r.action_zh||r.label||r.action),"green")}</td><td>${esc(r.promotion_score)}</td><td>${flow(r)}</td><td class="${tone(r.rt_pct)}">${esc(r.rt_pct)}</td></tr>`).join(""):`<tr><td colspan="7" class="muted">暂无主线晋级候选。</td></tr>`}
function renderHistory(rows){$("history").innerHTML=rows&&rows.length?rows.slice().reverse().slice(0,20).map(x=>`<div class="hist"><span>${esc(x.date)} ${esc(x.time)} · ${esc(zh(x.type))}</span><strong>${esc(x.code)} ${esc(zh(x.name))} ${esc(zh(x.action))}</strong><span>${esc(x.qty)} 股 / ${esc(x.price)} · ${esc(evidence(x.note)||zh(x.note,""))}</span></div>`).join(""):`<div class="empty">暂无两天内操作记录。</div>`}
function renderClosed(rows){$("closed").innerHTML=rows&&rows.length?rows.slice().reverse().slice(0,20).map(x=>`<div class="hist"><span>${esc(x.date)} ${esc(x.time)}</span><strong>${esc(x.code)} ${esc(zh(x.name))} 卖出 ${esc(x.qty)} 股</strong><span>${esc(x.buy_price)} 到 ${esc(x.sell_price)} / ${esc(x.pnl_amount)} / ${esc(x.pnl_pct)} · ${esc(evidence(x.reason)||zh(x.reason,""))}</span></div>`).join(""):`<div class="empty">暂无已卖出历史订单。</div>`}
function render(d){const title=d.model_adapter?.remote_title||d.model_owner?.remote_title||"V152 远端监控台";document.title=zh(title);$("title").textContent=zh(title);$("dot").classList.toggle("ok",!!d.remote_quote_available);$("remoteState").textContent=zh(d.remote_status_label||(d.remote_quote_available?"行情连接可用":"行情连接不可用"));$("updated").textContent=`已更新 ${zh(d.generated_at||d.source_generated_at)}`;renderKpi(d);renderEnv(d);renderPositions(d.positions||[]);renderMainlines(d.market_environment?.mainlines||[]);renderIntraday(d.intraday_v1519_green||d.intraday_anomaly?.rows||[]);renderPromo(d.mainline_promotion_mapping||d.mainline_promotion||{});renderHistory(d.operation_history_2d||[]);renderClosed(d.closed_orders||[]);const old=localStorage.getItem("v152.remote.positionSig")||"",now=posSig(d.positions||[]);if(alarm&&old&&old!==now){ring();if("Notification" in window&&Notification.permission==="granted")new Notification("仓位变化",{body:"模型买卖或仓位结构发生变化。"})}localStorage.setItem("v152.remote.positionSig",now)}
async function load(){try{for(const f of["status.json","status_latest.json"]){const r=await fetch(f+"?t="+Date.now(),{cache:"no-store"});if(r.ok){render(await r.json());return}}throw new Error("状态文件不可用")}catch(e){$("dot").classList.remove("ok");$("remoteState").textContent="状态不可用";$("positions").innerHTML=`<div class="empty">远端状态加载失败：${esc(e.message)}</div>`}}if("Notification" in window&&Notification.permission==="default")Notification.requestPermission().catch(()=>{});load();setInterval(load,60000);
</script>
</body>
</html>
