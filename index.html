<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>V151 实时持仓观察</title>
<style>
:root{--bg:#f6f8fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#dde3ef;--up:#c2410c;--down:#047857;--bad:#b91c1c;--ok:#15803d;--idle:#94a3b8;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;font-variant-numeric:tabular-nums}.wrap{width:min(100%,640px);margin:0 auto;padding:10px}header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}h1{margin:0;font-size:19px}.notice,.meta{color:var(--muted);font-size:12px;line-height:1.45}.meta{text-align:right;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}.card,section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px}.card span{display:block;color:var(--muted);font-size:12px}.card b{display:block;margin-top:3px;font-size:18px}h2{margin:0 0 8px;font-size:15px}.position{display:grid;grid-template-columns:minmax(0,1.15fr) .62fr .58fr .58fr .85fr .86fr;gap:5px;align-items:center;padding:8px 0;border-top:1px solid #edf1f7;font-size:13px}.position:first-of-type{border-top:0}.position b{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}.position span{display:block;margin-top:2px;color:var(--muted);font-size:11px}.num{text-align:right;color:#344054}.up,.down{text-align:right;font-weight:700}.up{color:var(--up)}.down{color:var(--down)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.toolbar button{border:1px solid var(--line);border-radius:6px;background:white;padding:8px 10px}.toolbar button.on{background:var(--bad);border-color:var(--bad);color:white}.statusLine{display:flex;align-items:center;gap:8px;font-size:14px}.dot{width:10px;height:10px;border-radius:999px;background:var(--idle);box-shadow:0 0 0 4px rgba(148,163,184,.15)}.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(21,128,61,.14)}.dot.bad{background:var(--bad);box-shadow:0 0 0 4px rgba(185,28,28,.12)}footer{color:var(--muted);font-size:11px;line-height:1.5;text-align:center;padding:8px 4px 2px}@media(max-width:520px){.position{grid-template-columns:1fr .5fr .5fr .5fr .7fr .74fr;font-size:12px}.card b{font-size:17px}.wrap{padding:8px}}
</style>
</head>
<body>
<main class="wrap">
<header><div><h1>V151 实时持仓观察</h1><div class="notice" id="notice">仅观察，不构成交易建议。</div></div><div class="meta" id="meta">加载中<br>--</div></header>
<section style="margin-bottom:8px"><h2>远端状态</h2><div class="statusLine"><span id="statusDot" class="dot"></span><b id="remoteStatus">检测中</b></div></section>
<div class="cards"><div class="card"><span>组合收益</span><b id="ret">--</b></div><div class="card"><span>总权益</span><b id="equity">--</b></div><div class="card"><span>持仓市值</span><b id="marketValue">--</b></div><div class="card"><span>浮盈亏</span><b id="floatingPnl">--</b></div></div>
<section><h2>警报</h2><div class="toolbar"><button id="alarmBtn">开启仓位变化铃声</button><button id="testBtn">测试铃声</button></div><div class="notice" id="alarmState">关闭</div></section>
<section style="margin-top:8px"><h2>当前仓位</h2><div id="positions">加载中</div></section>
<footer>页面每 15 秒自动刷新。公网端只显示远端是否有可用状态，不展示具体行情源。</footer>
</main>
<script>
const $=id=>document.getElementById(id);let alarm=localStorage.getItem('v151.pub.alarm')==='on';let audioCtx=null;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const n=v=>Number(String(v||'0').replace('%','').replace('万',''))||0;const tone=v=>n(v)>=0?'up':'down';const sig=ps=>(ps||[]).map(p=>[p.code,p.name,p.qty,p.cost,p.state].map(v=>String(v??'')).join('|')).sort().join(';');
async function ensureAudio(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;if(!audioCtx)audioCtx=new C();if(audioCtx.state==='suspended')await audioCtx.resume();return true}async function ring(){if(!alarm)return;if(!(await ensureAudio()))return;const now=audioCtx.currentTime;[0,.22,.44].forEach((o,i)=>{const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.frequency.value=i===1?980:760;g.gain.setValueAtTime(.0001,now+o);g.gain.exponentialRampToValueAtTime(.25,now+o+.02);g.gain.exponentialRampToValueAtTime(.0001,now+o+.16);osc.connect(g).connect(audioCtx.destination);osc.start(now+o);osc.stop(now+o+.18)})}
function updateAlarm(){ $('alarmBtn').classList.toggle('on',alarm);$('alarmBtn').textContent=alarm?'关闭仓位变化铃声':'开启仓位变化铃声';$('alarmState').textContent=alarm?'已开启：仅新增/移除/数量/成本/状态变化提醒':'关闭：价格浮动不弹窗'}
function render(data){$('notice').textContent=data.notice||'仅观察，不构成交易建议。';$('meta').innerHTML='已更新<br>'+esc(data.source_generated_at||data.generated_at||'--');const ok=!!data.remote_quote_available;$('statusDot').className='dot '+(ok?'ok':'bad');$('remoteStatus').textContent=data.remote_status_label||(ok?'状态可用':'状态不可用');$('ret').textContent=data.paper_ret_pct||'--';$('ret').className=tone(data.paper_ret_pct);$('equity').textContent=data.equity||'--';$('marketValue').textContent=data.market_value||'--';$('floatingPnl').textContent=data.floating_pnl||'--';$('floatingPnl').className=tone(data.floating_pnl);const rows=data.positions||[];$('positions').innerHTML=rows.length?rows.map(p=>{const cls=tone(p.pnl_pct||p.pnl_amount);return `<article class="position"><div><b>${esc(p.code)} ${esc(p.name)}</b><span>${esc(p.state||'观察')}</span></div><div class="num"><span>持股</span><b>${esc(p.qty)}</b></div><div class="num"><span>成本</span>${esc(p.cost||'--')}</div><div class="num"><span>现价</span>${esc(p.price)}</div><div class="num">${esc(p.market_value||'--')}</div><div class="${cls}">${esc(p.pnl_amount||'--')} / ${esc(p.pnl_pct)}</div></article>`}).join(''):'暂无持仓';const old=localStorage.getItem('v151.pub.sig')||'';const neu=sig(rows);if(alarm&&old&&old!==neu){ring();alert('V151：买卖/仓位结构发生变化')}localStorage.setItem('v151.pub.sig',neu)}
async function load(){try{const res=await fetch('status.json?t='+Date.now(),{cache:'no-store'});render(await res.json())}catch(e){$('meta').innerHTML='更新失败<br>稍后重试';$('statusDot').className='dot bad';$('remoteStatus').textContent='状态不可用'}}$('alarmBtn').onclick=async()=>{alarm=!alarm;localStorage.setItem('v151.pub.alarm',alarm?'on':'off');if(alarm){await ensureAudio();alert('仓位变化铃声已开启。单纯价格变化不会弹窗。')}updateAlarm()};$('testBtn').onclick=async()=>{const old=alarm;alarm=true;await ring();alert('测试铃声完成');alarm=old;updateAlarm()};updateAlarm();load();setInterval(load,15000);
</script>
</body>
</html>
