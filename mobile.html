<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>V152 远端手机监控</title>
<style>
:root{
  color-scheme:dark;
  --bg:#030811;
  --panel:#081427;
  --panel2:#0b1b31;
  --line:#16415c;
  --line2:#0bc9de;
  --text:#f4f8ff;
  --muted:#8eb2cc;
  --cyan:#04dff4;
  --green:#09ef9c;
  --pink:#ff4f8f;
  --yellow:#ffd462;
  --orange:#ff9b45;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}
body{
  min-height:100vh;
  color:var(--text);
  font:14px/1.45 "Microsoft YaHei","PingFang SC",Inter,system-ui,sans-serif;
  background:
    linear-gradient(rgba(4,223,244,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(4,223,244,.05) 1px,transparent 1px),
    linear-gradient(180deg,#061123 0%,var(--bg) 34%,#02060d 100%);
  background-size:24px 24px,24px 24px,auto;
}
button,a{font:inherit;min-width:0}
.app{
  width:min(560px,100%);
  max-width:100%;
  min-height:100vh;
  margin:0 auto;
  padding:max(12px,env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
}
.top{
  display:grid;
  gap:10px;
  margin-bottom:12px;
}
h1,h2,h3,p{margin:0}
h1{font-size:24px;line-height:1.12;letter-spacing:0}
h2{font-size:16px;letter-spacing:0}
.sub,.muted{color:var(--muted)}
.sub{font-size:12px}
.status{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
}
.state,.button,.tab{
  border:1px solid rgba(4,223,244,.42);
  border-radius:8px;
  background:rgba(8,20,39,.9);
  color:var(--text);
}
.state{
  display:flex;
  gap:7px;
  align-items:center;
  min-width:0;
  width:100%;
  min-height:38px;
  padding:8px 10px;
}
.state b,.state span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{
  width:10px;
  height:10px;
  flex:0 0 auto;
  border-radius:50%;
  background:#627082;
  box-shadow:0 0 10px #627082;
}
.dot.ok{background:var(--green);box-shadow:0 0 14px var(--green)}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;min-width:0}
.button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:38px;
  padding:7px 10px;
  text-decoration:none;
  white-space:nowrap;
}
.button.on{border-color:var(--green);color:var(--green)}
.updated{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  color:var(--muted);
  font-size:12px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));
  gap:8px;
  margin-bottom:10px;
}
.panel{
  min-width:0;
  border:1px solid rgba(4,223,244,.25);
  border-radius:8px;
  background:linear-gradient(180deg,rgba(11,27,49,.96),rgba(5,13,26,.96));
  box-shadow:0 18px 56px rgba(0,0,0,.24),0 0 0 1px rgba(255,255,255,.02) inset;
}
.kpi{padding:11px}
.kpi span{display:block;color:var(--muted);font-size:12px}
.kpi strong{
  display:block;
  margin-top:4px;
  font-size:21px;
  line-height:1.1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.screen{
  display:none;
  gap:10px;
}
.screen.active{display:grid}
.block{padding:12px}
.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.pill{
  display:inline-flex;
  align-items:center;
  max-width:100%;
  min-height:24px;
  padding:2px 8px;
  border:1px solid #35536d;
  border-radius:999px;
  background:rgba(10,24,43,.88);
  color:#caefff;
  font-size:12px;
  font-weight:700;
  line-height:1.25;
  white-space:normal;
  overflow:hidden;
  overflow-wrap:anywhere;
}
.pill.green{border-color:rgba(9,239,156,.64);color:var(--green);background:rgba(9,239,156,.08)}
.pill.yellow{border-color:rgba(255,212,98,.6);color:var(--yellow);background:rgba(255,212,98,.08)}
.pill.red{border-color:rgba(255,79,143,.64);color:#ff8db7;background:rgba(255,79,143,.09)}
.pill.cyan{border-color:rgba(4,223,244,.58);color:var(--cyan);background:rgba(4,223,244,.07)}
.env{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(112px,100%),1fr));
  gap:7px;
}
.cell,.mini{
  min-width:0;
  border:1px solid var(--line);
  border-radius:7px;
  background:rgba(3,8,17,.48);
  padding:8px;
}
.cell span,.mini span{display:block;color:var(--muted);font-size:11px}
.cell b,.mini b{
  display:block;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.pos .mini b{
  white-space:normal;
  overflow:visible;
  text-overflow:clip;
  overflow-wrap:anywhere;
  line-height:1.35;
}
.gate{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:9px;
}
.note{
  border:1px solid rgba(255,212,98,.4);
  border-radius:8px;
  background:rgba(255,155,69,.08);
  color:#ffe0a4;
  padding:9px 10px;
  overflow-wrap:anywhere;
}
.cards,.timeline,.signals{display:grid;gap:8px}
.strength-meta{
  margin:-3px 0 8px;
  color:#8ecfff;
  font-size:12px;
  overflow-wrap:anywhere;
}
.strength-list{display:grid}
.strength-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(116px,58%) 48px;
  gap:10px;
  align-items:center;
  min-width:0;
  padding:10px 0;
  border-bottom:1px solid rgba(67,112,147,.32);
}
.strength-row:last-child{border-bottom:0}
.strength-title{
  font-weight:800;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.strength-sub{
  margin-top:3px;
  color:#83d4ff;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.strength-meter{
  height:8px;
  border:1px solid rgba(4,223,244,.65);
  border-radius:999px;
  background:#041326;
  overflow:hidden;
}
.strength-fill{
  display:block;
  height:100%;
  min-width:4px;
  border-radius:inherit;
  background:linear-gradient(90deg,#1df2c0 0%,#32efac 28%,#fff068 48%,#ff7b4d 68%,#ff2f93 100%);
  box-shadow:0 0 10px rgba(255,47,147,.45);
}
.strength-num{
  color:var(--pink);
  font-weight:900;
  text-align:right;
  white-space:nowrap;
}
.pos,.signal,.item{
  min-width:0;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(3,8,17,.48);
  padding:10px;
}
.pos-history{
  margin-top:8px;
  border:1px solid var(--line);
  border-radius:7px;
  background:rgba(10,24,43,.6);
  padding:8px;
  display:grid;
  gap:5px;
  font-size:12px;
}
.pos-history b,.pos-history span{
  display:block;
  overflow:visible;
  text-overflow:clip;
  white-space:normal;
  overflow-wrap:anywhere;
  line-height:1.35;
}
.pos-history span{color:var(--muted)}
.row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  min-width:0;
}
.title{min-width:0}
.title b,.title span{
  display:block;
  max-width:100%;
  overflow-wrap:anywhere;
}
.title b{font-size:15px}
.title span{color:var(--muted);font-size:12px}
.posgrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(136px,100%),1fr));
  gap:6px;
  margin-top:8px;
}
.signal meta,.item span{display:block;color:var(--muted);font-size:12px}
.item b{display:block;overflow-wrap:anywhere}
.signalline{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:7px;
}
.name{font-weight:800}
.empty{
  border:1px dashed #31506b;
  border-radius:8px;
  color:#a9c5dc;
  background:rgba(3,8,17,.36);
  padding:12px;
}
.up{color:var(--pink)}
.down{color:var(--green)}
.flat{color:var(--muted)}
.tabs{
  position:sticky;
  top:max(8px,env(safe-area-inset-top));
  z-index:4;
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,minmax(56px,1fr));
  gap:7px;
  margin-bottom:10px;
  padding:8px 0;
  border-top:1px solid rgba(4,223,244,.22);
  border-bottom:1px solid rgba(4,223,244,.22);
  background:rgba(2,7,15,.94);
  backdrop-filter:blur(12px);
}
#records,[data-screen="records"],#gateNote,[data-module="intraday_anomaly"]{display:none!important}
.tab{
  min-height:44px;
  padding:6px 4px;
  text-align:center;
  letter-spacing:0;
}
.tab.on{
  border-color:var(--green);
  background:rgba(9,239,156,.11);
  color:var(--green);
}
@media(max-width:560px){
  .app{padding-left:10px;padding-right:10px}
  .tabs{gap:6px}
  .status{grid-template-columns:1fr}
  .actions{width:100%}
  .head{flex-wrap:wrap}
}
@media(max-width:420px){
  h1{font-size:21px}
  .grid{grid-template-columns:1fr}
  .env,.posgrid{grid-template-columns:repeat(auto-fit,minmax(min(128px,100%),1fr))}
  .strength-row{grid-template-columns:minmax(0,1fr) 36% 42px;gap:7px}
  .block{padding:10px}
  .pos,.signal,.item{padding:9px}
}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1 id="title">V152 远端手机监控</h1>
      <div class="sub">V152 核心纸面执行与持仓观察</div>
    </div>
    <div class="status">
      <div class="state"><i id="dot" class="dot"></i><b id="remoteState">状态读取中</b></div>
      <div class="actions">
        <a class="button" href="index.html">桌面版</a>
        <button id="alarmBtn" class="button">铃声 OFF</button>
      </div>
    </div>
    <div class="updated"><span id="updated">已更新 --</span><span id="positionCount">--</span></div>
  </header>

  <nav class="tabs">
    <button class="tab on" data-screen="overview">概览</button>
    <button class="tab" data-screen="holdings">仓位</button>
    <button class="tab" data-screen="signals">信号</button>
    <button class="tab" data-screen="records">记录</button>
  </nav>

  <section id="overview" class="screen active">
    <article class="panel block" data-module="mainline_strength">
      <div class="head"><h2>主线强度</h2><span id="mainlineStrengthCount" class="pill green">--</span></div>
      <div id="mainlineStrengthMeta" class="strength-meta">等待桌面端同步。</div>
      <div id="mainlineStrength" class="strength-list"></div>
    </article>
    <article class="panel block" data-module="market_environment">
      <div class="head"><h2>环境</h2><span id="envBadge" class="pill cyan">读取中</span></div>
      <div class="env">
        <div class="cell"><span>市场温度</span><b id="envMarket">--</b></div>
        <div class="cell"><span>资金结构</span><b id="envCapital">--</b></div>
        <div class="cell"><span>恐贪分</span><b id="envFear">--</b></div>
      </div>
    </article>
    <article class="panel block" data-module="scan_read_framework">
      <div class="head"><h2>V152 实盘口径健康</h2><span id="liveHealthBadge" class="pill cyan">读取中</span></div>
      <div class="env">
        <div class="cell"><span>5m覆盖</span><b id="live5mCoverage">--</b></div>
        <div class="cell"><span>买点证据</span><b id="live5mReady">--</b></div>
        <div class="cell"><span>口径审计</span><b id="liveAuditStatus">--</b></div>
        <div class="cell"><span>远端同步</span><b id="liveRemoteSync">--</b></div>
      </div>
      <div id="liveHealthNote" class="note" style="margin-top:8px">等待桌面同步。</div>
    </article>
  </section>

  <section id="holdings" class="screen">
    <section class="grid" data-module="portfolio_summary">
      <article class="panel kpi"><span>总权益</span><strong id="equity">--</strong><span id="equityMeta">--</span></article>
      <article class="panel kpi"><span>浮动盈亏</span><strong id="floating">--</strong><span id="floatingPct">--</span></article>
      <article class="panel kpi"><span>持仓市值</span><strong id="marketValue">--</strong><span id="cash">--</span></article>
      <article class="panel kpi"><span>已实现盈亏</span><strong id="realized">--</strong><span>重置后口径</span></article>
    </section>
    <article class="panel block" data-module="positions">
      <div class="head"><h2>当前仓位</h2><span id="holdingCount" class="pill cyan">--</span></div>
      <div id="positions" class="cards"></div>
    </article>
  </section>

  <section id="signals" class="screen">
    <article class="panel block" data-module="intraday_anomaly">
      <div class="head"><h2>分时强信号</h2><span id="intradayCount" class="pill green">--</span></div>
      <div id="intraday" class="signals"></div>
    </article>
    <article class="panel block" data-module="mainline_monitor_pool">
      <div class="head"><h2>核心候选池</h2><span id="candidateCount" class="pill green">--</span></div>
      <div id="candidatePool" class="signals"></div>
    </article>
  </section>

  <section id="records" class="screen">
    <article class="panel block" data-module="operation_history">
      <div class="head"><h2>两天操作</h2><span class="pill cyan">最近</span></div>
      <div id="history" class="timeline"></div>
    </article>
    <article class="panel block" data-module="closed_orders">
      <div class="head"><h2>卖出记录</h2><span class="pill cyan">盈亏</span></div>
      <div id="closed" class="timeline"></div>
    </article>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let modelLabels = {};
let heartbeatTimer = null;
let heartbeatEndpoint = "";
function remoteSessionId(){
  const key = "v152.remote.session";
  try{
    let id = localStorage.getItem(key);
    if(!id){
      id = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : `s_${Date.now()}_${Math.random().toString(16).slice(2)}`;
      localStorage.setItem(key, id);
    }
    return id;
  }catch(_){
    return `s_${Date.now()}_${Math.random().toString(16).slice(2)}`;
  }
}
function setupHeartbeat(cfg, page){
  const h = cfg || {};
  const endpoint = String(h.endpoint || "").replace(/\/+$/,"");
  if(!h.enabled || !endpoint){
    if(heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = null;
    heartbeatEndpoint = "";
    return;
  }
  const send = () => {
    fetch(`${endpoint}/heartbeat`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({session_id:remoteSessionId(), page, model:"V152", at:Date.now()}),
      keepalive:true
    }).catch(()=>{});
  };
  const interval = Math.max(15, Number(h.interval_seconds) || 30) * 1000;
  if(heartbeatEndpoint !== endpoint){
    if(heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatEndpoint = endpoint;
    send();
    heartbeatTimer = setInterval(send, interval);
  }
}
const Text = {
  V152_STABLE_ATTACK:"稳定攻击模型",
  MAINLINE_PROMOTION_MONITOR:"核心候选监控",
  PROMOTION_CANDIDATE_MONITOR:"核心候选",
  PROMOTION_WATCH:"候选观察",
  MODEL_AUTO_BUY:"模型模拟买入",
  MODEL_AUTO_SELL:"模型模拟卖出",
  MODEL_AUTO_LOCAL_STRUCTURE:"模型本地结构信号",
  MODEL_EXPECTATION_REDUCE:"低预期模拟减仓",
  USER_MANUAL_BUY:"用户实盘手动买入",
  USER_MANUAL_SELL:"用户实盘手动卖出",
  WAIT_CONFIRM:"等待确认",
  WAIT:"等待",
  OBSERVE:"观察",
  ATTACK_CONFIRMED:"分时进攻确认",
  ACCEPTANCE_IMPROVING:"承接增强",
  WATCH_BUY_POINT:"买点观察",
  INTRADAY_RISK:"分时风险",
  ok:"正常",
  observe:"观察",
  below_cost:"低于成本",
  defense:"跌破防守线",
  strict:"跌破严格线",
  HOT:"市场偏热",
  WARM:"市场偏暖",
  NEUTRAL:"市场中性",
  COLD:"市场偏冷",
  RISK_OFF:"风险退潮",
  DATA_STALE:"数据失真",
  BROAD_INFLOW:"资金扩散进攻",
  STRUCTURAL_INFLOW:"结构性流入",
  OUTFLOW:"资金退潮",
  CROWDING:"资金抱团",
  LOCAL_ROTATION_TRAP:"局部轮动陷阱"
};
const badRe = /锟|�|閼|闂|閹|鐠|娴|妗|鍊|濡|瀵|绾搁|杩滅|璧涘|\?\//;
const enumRe = /^[A-Z0-9_.-]+(?:_[A-Z0-9_.-]+)+$/;
function raw(v){ return v === undefined || v === null || v === "" ? "--" : String(v); }
function zh(v, fallback = "--"){
  let s = raw(v).trim();
  if(!s || s === "--") return fallback;
  if(modelLabels[s]) return modelLabels[s];
  if(Text[s]) return Text[s];
  Object.keys(modelLabels || {}).sort((a,b)=>b.length-a.length).forEach(key => { s = s.split(key).join(modelLabels[key]); });
  if(badRe.test(s) || /\?{2,}/.test(s)) return fallback;
  if(enumRe.test(s)) return "系统信号";
  return s.replace(/\.v\d+/g,"");
}
function esc(v){ return raw(v).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function num(v){ const x = parseFloat(raw(v).replace(/[,%万]/g,"")); return Number.isFinite(x) ? x : 0; }
function tone(v){ const x = num(v); return x > 0 ? "up" : x < 0 ? "down" : "flat"; }
function code(v){ return raw(v).padStart(6,"0"); }
function compact(v, n = 48){ const s = zh(v,""); return s.length > n ? s.slice(0,n) + "..." : s; }
function pill(label, cls = "cyan"){ return `<span class="pill ${cls}">${esc(label || "--")}</span>`; }
function flowText(r){
  return zh(r?.v1519_flow || [r?.hiddenflow_label,r?.hiddenflow_score].filter(Boolean).join(" ") || "--");
}
function flowPill(r){
  const s = flowText(r);
  const cls = /出货|风险|转弱|撤退/.test(s) ? "yellow" : /承接|确认|增强|净流入/.test(s) ? "green" : "cyan";
  return pill(s, cls);
}
function blocker(v){
  const s = raw(v);
  if(s === "regime_risk_off") return "市场风险退潮";
  if(s === "market_breadth_stale") return "涨跌家数过期";
  if(s === "not_closing_10m_gate_window") return "未到尾盘窗口";
  if(s.startsWith("market_env_age>")) return "环境扫描超时";
  if(s.startsWith("candidate_mood<")) return "候选热度偏低";
  if(s.startsWith("fear_greed<")) return "恐贪分偏低";
  if(s.startsWith("capital_structure_")) return "资金结构未放行";
  if(s.startsWith("regime_")) return "市场温度未放行";
  return zh(s,"门控诊断");
}
function noteText(x){
  const text = zh(x?.note,"");
  if(text) return compact(text,72);
  if(x?.type === "USER_MANUAL_BUY") return `截图确认：${zh(x.qty)}股，成本${zh(x.price)}`;
  return "桌面模型记录";
}

function actionText(x){
  return zh(x?.action || x?.type || "模型动作");
}
function heldActionText(x){
  const price = zh(x?.price,"");
  const fallback = `${actionText(x)} ${zh(x?.qty)}股${price && price !== "--" ? ` 成交价${price}` : ""}`;
  return zh(x?.summary || fallback);
}
function heldHistoryHtml(p){
  const rows = p.held_operation_history || [];
  if(!rows.length) return "";
  return `<div class="pos-history">
    <b>当前持仓操作记录</b>
    ${rows.slice().reverse().slice(0,4).map(x => `<span>${esc(zh(x.date))} ${esc(zh(x.time))} · ${esc(heldActionText(x))}</span>`).join("")}
  </div>`;
}

let alarm = localStorage.getItem("v152.remote.mobile.alarm") === "1";
const POSITION_ALARM_SIG_KEY = "v152.remote.mobile.positionTradeSig.v2";
const POSITION_ALARM_AT_KEY = "v152.remote.mobile.positionTradeSig.alertAt";
const POSITION_ALARM_COOLDOWN_MS = 30000;
const MOBILE_SCREEN_KEY = "v152.remote.mobile.activeScreen";
function setAlarm(){
  $("alarmBtn").classList.toggle("on", alarm);
  $("alarmBtn").textContent = alarm ? "铃声 ON" : "铃声 OFF";
}
function ring(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0,.18,.36].forEach((t,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.value = i % 2 ? 1260 : 900;
      gain.gain.setValueAtTime(.0001, ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + t + .02);
      gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t + .15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + t); osc.stop(ctx.currentTime + t + .17);
    });
  }catch(e){}
}
function notifyPosition(){
  if("Notification" in window && Notification.permission === "granted"){
    new Notification("仓位变化",{body:"模型买卖或仓位结构发生变化。"});
  }
}
function posNum(v){ const n = Number(String(v ?? "").replace(/[%，,]/g,"").replace(/[^\d.+-]/g,"")); return Number.isFinite(n) ? n : NaN; }
function posCode(v){ const d = String(v ?? "").replace(/\D/g,""); return d ? d.padStart(6,"0").slice(-6) : String(v ?? "").trim(); }
function posQty(v){ const n = posNum(v); return Number.isFinite(n) ? String(Math.round(n)) : ""; }
function positionSig(rows){
  return (rows || []).map(p => [posCode(p.code),posQty(p.qty)].join(":")).sort().join("|");
}
function shouldPositionAlarm(now){
  const old = localStorage.getItem(POSITION_ALARM_SIG_KEY) || "";
  if(!old){ localStorage.setItem(POSITION_ALARM_SIG_KEY, now); return false; }
  if(old === now) return false;
  localStorage.setItem(POSITION_ALARM_SIG_KEY, now);
  const ts = Date.now();
  const last = Number(localStorage.getItem(POSITION_ALARM_AT_KEY) || 0);
  if(ts - last < POSITION_ALARM_COOLDOWN_MS) return false;
  localStorage.setItem(POSITION_ALARM_AT_KEY, String(ts));
  return true;
}
$("alarmBtn").onclick = async () => {
  alarm = !alarm;
  localStorage.setItem("v152.remote.mobile.alarm", alarm ? "1" : "0");
  setAlarm();
  if(alarm){
    localStorage.setItem(POSITION_ALARM_SIG_KEY, positionSig(window.__lastMobilePositions || []));
    if("Notification" in window && Notification.permission === "default"){
      try{ await Notification.requestPermission(); }catch(e){}
    }
  }
};
function selectMobileScreen(screenId){
  const target = document.getElementById(screenId) ? screenId : "overview";
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.screen === target));
  document.querySelectorAll(".screen").forEach(x => x.classList.toggle("active", x.id === target));
  localStorage.setItem(MOBILE_SCREEN_KEY, target);
}

function pct4(v){

function accountGuardMeta(g){
  if(!g || g.drawdown_pct === undefined || g.drawdown_pct === null || g.drawdown_pct === "") return "";
  const parts = [`回撤 ${pct4(g.drawdown_pct)}`];
  if(g.attack_weight_pct !== undefined && g.attack_weight_pct !== null && g.attack_weight_pct !== "") parts.push(`攻击仓上限 ${Number(g.attack_weight_pct).toFixed(0)}%`);

function parseCoveragePair(v){
  const m = String(v || "").match(/(\d+)\s*\/\s*(\d+)/);
  return m ? { covered: Number(m[1]), total: Number(m[2]) } : { covered: 0, total: 0 };
}

  if(["green","ok","synced"].includes(s)) return "green";
  if(["red","bad","error"].includes(s)) return "red";
  if(["yellow","warn","syncing"].includes(s)) return "yellow";
  return "cyan";
}

  const auditMod = scanModule(data, "v152_live_replay_parity_audit");
  const native = data.data_health?.v152_native_candidate || {};
  const remote = data.remote_sync || {};
  const pair = parseCoveragePair(health.five_m_coverage || five.fetch_message || fiveMod.coverage || "");
  const covered = Number(health.covered_rows ?? five.covered_rows ?? pair.covered ?? 0);
  const total = Number(health.rows ?? five.rows ?? pair.total ?? native.rows ?? data.candidate_rows ?? 0);
  const ready = Number(health.entry_ok_rows ?? five.entry_ok_rows ?? (audit.rows_detail || []).filter(x => x.live_5m_entry_ok && x.gate_allow_buy).length ?? 0);
  const violations = Number(health.hard_violations ?? audit.violation_rows ?? audit.hard_violations ?? native.replay_parity_violation_rows ?? 0);

  $("live5mReady").textContent = `${ready} 条`;

  $("liveHealthBadge").className = "pill " + (ok ? "green" : "yellow");
  $("liveHealthNote").innerHTML = [
    pill(zh(health.five_m_status_label || fiveMod.status_label || five.fetch_message || "5m证据"), healthClass(health.status || fiveMod.status)),

  ].join(" ");

function strengthValue(line){
  const primary = [
    line.strong_candidates,
    line.strong_count,
    line.strong_total
  ];
  for(const value of primary){
    if(value === undefined || value === null || value === "") continue;
    const n = num(value);
    if(Number.isFinite(n)) return Math.max(0, Math.round(n));
  }
  const fallback = [
    line.companies,
    line.node_count,
    line.shown_count,
    line.live_up_count,
    line.green_count,
    line.core_candidates
  ];
  for(const value of fallback){
    const n = num(value);
    if(Number.isFinite(n) && n > 0) return Math.round(n);
  }
  return 0;
}
function strengthSubtitle(line){
  if(line.top_companies){
    return [line.node,line.top_companies].filter(Boolean).map(x => zh(x,"")).join(" · ");
  }
  const nodes = (line.nodes || []).slice(0,4).map(node => {
    const part = [node.node,node.name].filter(Boolean).map(x => zh(x,"")).join(" · ");
    return part || zh(node.name || node.code,"");
  }).filter(Boolean);
  if(nodes.length) return nodes.join("；");
  if(line.leader_name) return [line.leader_role,line.leader_name].filter(Boolean).map(x => zh(x,"")).join(" · ");
  return zh(line.strength_reason || line.summary || "等待主线聚合");
}

  return `<div class="strength-row">
    <div class="strength-text">
      <div class="strength-title">${esc(title)}</div>
      <div class="strength-sub">${esc(compact(strengthSubtitle(line),56))}</div>
    </div>
    <div class="strength-meter"><i class="strength-fill" style="width:${width.toFixed(1)}%"></i></div>
    <div class="strength-num">${value} 强</div>
  </div>`;
}

  document.querySelectorAll("[data-module]").forEach(el => {
    const rule = modules[el.dataset.module] || {};
    const visible = ["core","support"].includes(String(rule.mode || "hidden"));
    el.style.display = visible ? "" : "none";
    el.title = rule.reason || rule.mode_label || "";
  });
}

async function load(){
  try{
    const sources = [
      "status_latest.json",
      "status.json",
      "https://raw.githubusercontent.com/BINBINYES/BINBINYES.github.io/main/status_latest.json",
      "https://raw.githubusercontent.com/BINBINYES/BINBINYES.github.io/main/status.json",
      "https://raw.githubusercontent.com/BINBINYES/BINBINYES.github.io/v152-live-status/status_latest.json"
    ];
    let lastError = "";
    let best = null;
    for(const source of sources){
      try{
        const joiner = source.includes("?") ? "&" : "?";
        const res = await fetch(source + joiner + "t=" + Date.now(), {cache:"no-store"});
        if(!res.ok){
          lastError = `HTTP ${res.status} @ ${source}`;
          continue;
        }
        const data = await res.json();
        const rawTime = String(data.generated_at || data.source_generated_at || "").replace(" ", "T");
        const stamp = Date.parse(rawTime + (rawTime.includes("T") ? "+08:00" : "")) || 0;
        if(!best || stamp >= best.stamp){
          best = {data, stamp, source};
        }
      }catch(sourceError){
        lastError = `${sourceError.message} @ ${source}`;
      }
    }
    if(best){ render(best.data); return; }
    throw new Error(lastError || "状态不可用");
  }catch(err){
    $("dot").classList.remove("ok");
    $("remoteState").textContent = "状态不可用";
    $("updated").textContent = "加载失败";
    $("positions").innerHTML = `<div class="empty">远端状态加载失败：${esc(err.message)}。</div>`;
  }
}
load();
setInterval(load,15000);
